name: Build Mod from ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Распаковка и подготовка
        run: |
          cat << 'EOF' > unpack.py
          import os, glob, zipfile, shutil

          # 1. Распаковка архивов
          for z in set(glob.glob("*.zip") + glob.glob("**/*.zip", recursive=True)):
              try:
                  with zipfile.ZipFile(z, "r") as zf:
                      zf.extractall(".")
              except Exception as e:
                  print(f"Zip warning: {e}")

          # 2. Поиск папки с build.gradle
          target_dir = None
          for root, dirs, files in os.walk("."):
              if any(x in root.split(os.sep) for x in [".gradle", "build", ".github"]):
                  continue
              if "build.gradle" in files and root != ".":
                  target_dir = root
                  break

          # 3. Полный перенос файлов со слиянием каталогов (src и ресурсы)
          if target_dir:
              print(f"Переносим файлы из {target_dir} в корень...")
              for item in os.listdir(target_dir):
                  s = os.path.join(target_dir, item)
                  d = os.path.join(".", item)
                  if os.path.isdir(s):
                      shutil.copytree(s, d, dirs_exist_ok=True)
                  else:
                      shutil.copy2(s, d)

          # 4. Очистка BOM-символов в конфигурациях
          for gfile in ["settings.gradle", "build.gradle"]:
              if os.path.exists(gfile):
                  with open(gfile, "r", encoding="utf-8-sig", errors="ignore") as f:
                      content = f.read()
                  content = content.lstrip('\ufeff\u200b\x00')
                  with open(gfile, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"{gfile} очищен!")
          EOF
          python3 unpack.py

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Сборка .jar
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseG1GC'"
        run: gradle build -x test --stacktrace

      - name: Выгрузка готового мода
        uses: actions/upload-artifact@v4
        with:
          name: ReallyVisuals-Mod
          path: "**/build/libs/*.jar"
          
