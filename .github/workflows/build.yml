name: Build Mod from ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Распаковка и авто-структурирование проекта
        run: |
          cat << 'EOF' > unpack.py
          import os, glob, zipfile, shutil

          # 1. Распаковка архивов
          for z in set(glob.glob("*.zip") + glob.glob("**/*.zip", recursive=True)):
              try:
                  with zipfile.ZipFile(z, "r") as zf:
                      zf.extractall(".")
                  print(f"Распакован: {z}")
              except Exception as e:
                  print(f"Ошибка zip: {e}")

          # 2. Поиск директории с build.gradle и перенос всего содержимого в корень
          target_dir = None
          for root, dirs, files in os.walk("."):
              if any(x in root.split(os.sep) for x in [".gradle", "build", ".github", ".git"]):
                  continue
              if "build.gradle" in files and root != ".":
                  target_dir = root
                  break

          if target_dir:
              print(f"Перенос проекта из {target_dir} в корень...")
              for item in os.listdir(target_dir):
                  s = os.path.join(target_dir, item)
                  d = os.path.join(".", item)
                  if os.path.isdir(s):
                      shutil.copytree(s, d, dirs_exist_ok=True)
                  else:
                      shutil.copy2(s, d)

          # 3. Проверка и приведение структуры src к стандарту Gradle
          if os.path.exists("src") and not os.path.exists("src/main"):
              print("Исправление нестандартной структуры src...")
              os.makedirs("src_temp/main/java", exist_ok=True)
              for item in os.listdir("src"):
                  shutil.move(os.path.join("src", item), os.path.join("src_temp/main/java", item))
              shutil.rmtree("src")
              shutil.move("src_temp", "src")

          # 4. Очистка BOM-символов
          for gfile in ["settings.gradle", "build.gradle"]:
              if os.path.exists(gfile):
                  with open(gfile, "r", encoding="utf-8-sig", errors="ignore") as f:
                      content = f.read().lstrip('\ufeff\u200b\x00')
                  with open(gfile, "w", encoding="utf-8") as f:
                      f.write(content)

          print("\n--- Структура файлов перед сборкой ---")
          for root, dirs, files in os.walk("."):
              if any(x in root.split(os.sep) for x in [".gradle", "build", ".github", ".git"]):
                  continue
              print(root, files)
          EOF
          python3 unpack.py

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Сборка .jar
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseG1GC'"
        run: gradle build -x test --stacktrace

      - name: Проверка размера .jar файла
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Ошибка: JAR файл не найден!"
            exit 1
          fi
          SIZE=$(stat -c%s "$JAR_FILE")
          echo "Размер собранного файла: $SIZE байт"
          if [ "$SIZE" -lt 10000 ]; then
            echo "Ошибка: Собрался пустой JAR ($SIZE байт)! Исходный код src не был подхвачен."
            exit 1
          fi

      - name: Выгрузка готового мода
        uses: actions/upload-artifact@v4
        with:
          name: ReallyVisuals-Mod
          path: "**/build/libs/*.jar"
          
