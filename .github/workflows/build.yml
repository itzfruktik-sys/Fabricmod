name: Build Mod from ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Распаковка и поиск файлов
        run: |
          unzip -o *.zip
          if [ ! -f "build.gradle" ]; then
            BG_PATH=$(find . -maxdepth 3 -name "build.gradle" | head -n 1)
            if [ -n "$BG_PATH" ]; then
              DIR=$(dirname "$BG_PATH")
              echo "Найден проект в папке: $DIR"
              cp -rn "$DIR"/* . || true
            fi
          fi

      - name: Авто-исправление маппингов
        run: |
          python3 -c "
          import os, re
          if os.path.exists('build.gradle'):
              with open('build.gradle', 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              new_content = re.sub(r'mappings\s+[\"'].*?[\"']', 'mappings \"net.fabricmc:intermediary:1.16.5:v2\"', content)
              with open('build.gradle', 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print('--- Маппинги заменены на Intermediary v2 ---')
          else:
              print('Предупреждение: build.gradle не найден в корне')
          "

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Сборка `.jar`
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew build
          else
            gradle build
          fi

      - name: Выгрузка готового мода
        uses: actions/upload-artifact@v4
        with:
          name: ReallyVisuals-Mod
          path: "**/build/libs/*.jar"
          
