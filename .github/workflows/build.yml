name: Build Mod from ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Распаковка архива и подготовка
        run: |
          cat << 'EOF' > unpack.py
          import os, glob, zipfile, shutil

          # 1. Просто распаковываем архив как есть
          for z in set(glob.glob("*.zip") + glob.glob("**/*.zip", recursive=True)):
              print(f"Распаковка {z}...")
              try:
                  with zipfile.ZipFile(z, "r") as zf:
                      zf.extractall(".")
              except Exception as e:
                  print(f"Ошибка распаковки: {e}")

          # 2. Если проект распаковался во вложенную папку — поднимаем в корень
          if not os.path.exists("build.gradle"):
              for root, dirs, files in os.walk("."):
                  if "build.gradle" in files and root != ".":
                      print(f"Переносим файлы из {root} в корень...")
                      for item in os.listdir(root):
                          shutil.move(os.path.join(root, item), os.path.join(".", item))
                      break

          # 3. Чистим только невидимые BOM-символы в конфигах (чтобы Gradle не ругался)
          for gfile in ["settings.gradle", "build.gradle"]:
              if os.path.exists(gfile):
                  with open(gfile, "r", encoding="utf-8-sig", errors="ignore") as f:
                      content = f.read().lstrip('\ufeff\u200b\x00')
                  with open(gfile, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Файл {gfile} очищен от BOM.")
          EOF
          python3 unpack.py

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Сборка .jar
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseG1GC'"
        run: gradle build -x test --stacktrace

      - name: Проверка размера .jar
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Ошибка: JAR не найден!"
            exit 1
          fi
          SIZE=$(stat -c%s "$JAR_FILE")
          echo "Размер собранного мода: $SIZE байт"
          if [ "$SIZE" -lt 10000 ]; then
            echo "Ошибка: Собрался пустой файл ($SIZE байт)."
            exit 1
          fi

      - name: Выгрузка готового мода
        uses: actions/upload-artifact@v4
        with:
          name: ReallyVisuals-Mod
          path: "**/build/libs/*.jar"
          
