name: Build Mod from ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Распаковка и очистка конфигов
        run: |
          cat << 'EOF' > unpack.py
          import os, glob, zipfile, shutil, re

          # 1. Распаковка архивов
          for z in set(glob.glob("*.zip") + glob.glob("**/*.zip", recursive=True)):
              try:
                  with zipfile.ZipFile(z, "r") as zf:
                      zf.extractall(".")
              except Exception as e:
                  print(f"Zip warning: {e}")

          # 2. Перенос файлов в корень
          for root, dirs, files in os.walk("."):
              if any(x in root.split(os.sep) for x in [".gradle", "build", ".github"]):
                  continue
              if "build.gradle" in files and root != ".":
                  for item in os.listdir(root):
                      src = os.path.join(root, item)
                      dst = os.path.join(".", item)
                      if not os.path.exists(dst):
                          shutil.move(src, dst)
                  break

          # 3. Чистка BOM-символов и мусора в gradle-файлах
          for gfile in ["settings.gradle", "build.gradle"]:
              if os.path.exists(gfile):
                  with open(gfile, "r", encoding="utf-8-sig", errors="ignore") as f:
                      content = f.read()
                  
                  # Удаляем невидимые спецсимволы в начале файла
                  content = content.lstrip('\ufeff\u200b\x00')

                  if gfile == "build.gradle":
                      content = re.sub(r'mappings\s+["\'].*?["\']', 'mappings "net.fabricmc:intermediary:1.16.5:v2"', content)

                  with open(gfile, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"{gfile} очищен и сохранён!")
          EOF
          python3 unpack.py

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Сборка .jar
        run: gradle build --stacktrace

      - name: Выгрузка готового мода
        uses: actions/upload-artifact@v4
        with:
          name: ReallyVisuals-Mod
          path: "**/build/libs/*.jar"
          
