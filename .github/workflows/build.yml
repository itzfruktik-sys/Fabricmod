name: Build Mod from ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Распаковка и принудительное перемещение в корень
        run: |
          cat << 'EOF' > unpack.py
          import os, glob, zipfile, shutil

          print("=== 1. Поиск и распаковка ZIP архивов ===")
          zip_files = glob.glob("*.zip") + glob.glob("**/*.zip", recursive=True)
          for z in set(zip_files):
              if ".gradle" in z or "build" in z:
                  continue
              print(f"Распаковываем архив: {z}")
              try:
                  with zipfile.ZipFile(z, "r") as zf:
                      zf.extractall("unpacked_temp")
                  print("Успешно распаковано во временную папку unpacked_temp")
              except Exception as e:
                  print(f"Ошибка распаковки {z}: {e}")

          # Если архивы распаковались
          if os.path.exists("unpacked_temp"):
              root_src = "unpacked_temp"
              for r, d, f in os.walk("unpacked_temp"):
                  if "build.gradle" in f:
                      root_src = r
                      break
              
              print(f"Переносим проект из '{root_src}' в корень...")
              for item in os.listdir(root_src):
                  s = os.path.join(root_src, item)
                  d = os.path.join(".", item)
                  if os.path.isdir(s):
                      if os.path.exists(d):
                          shutil.rmtree(d)
                      shutil.copytree(s, d)
                  else:
                      shutil.copy2(s, d)
              shutil.rmtree("unpacked_temp")

          # Если src все еще в подпапке — поднимем его в корень
          if not os.path.exists("src"):
              for r, dirs, files in os.walk("."):
                  if any(x in r.split(os.sep) for x in [".gradle", "build", ".git"]):
                      continue
                  if "src" in dirs and r != ".":
                      print(f"Найдена папка src в {r}, переносим все файлы в корень...")
                      for item in os.listdir(r):
                          s = os.path.join(r, item)
                          d = os.path.join(".", item)
                          if os.path.isdir(s):
                              if os.path.exists(d):
                                  shutil.rmtree(d)
                              shutil.copytree(s, d)
                          else:
                              shutil.copy2(s, d)
                      break

          print("\n=== 2. Очистка файлов конфигурации от BOM ===")
          for gfile in ["settings.gradle", "build.gradle", "gradle.properties"]:
              if os.path.exists(gfile):
                  with open(gfile, "r", encoding="utf-8-sig", errors="ignore") as f:
                      content = f.read().lstrip('\ufeff\u200b\x00')
                  with open(gfile, "w", encoding="utf-8") as f:
                      f.write(content)

          print("\n=== 3. Проверка содержимого папки src ===")
          if os.path.exists("src"):
              for root, dirs, files in os.walk("src"):
                  print(root, files)
          else:
              print("ВНИМАНИЕ: Папка 'src' не найдена в корне!")

          EOF
          python3 unpack.py

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Сборка .jar
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseG1GC'"
        run: gradle build -x test --stacktrace

      - name: Проверка размера .jar
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Ошибка: JAR не найден!"
            exit 1
          fi
          SIZE=$(stat -c%s "$JAR_FILE")
          echo "Размер собранного мода: $SIZE байт"
          if [ "$SIZE" -lt 10000 ]; then
            echo "Ошибка: Собрался пустой файл ($SIZE байт)."
            exit 1
          fi

      - name: Выгрузка готового мода
        uses: actions/upload-artifact@v4
        with:
          name: ReallyVisuals-Mod
          path: "**/build/libs/*.jar"
          
