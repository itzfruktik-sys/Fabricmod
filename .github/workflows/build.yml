name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unpack project and fix structure
        run: |
          python3 -c "
          import os, shutil, zipfile

          print('=== 1. ПРОВЕРКА ФАЙЛОВ В РЕПОЗИТОРИИ ===')
          root_files = os.listdir('.')
          print('Файлы в корне:', root_files)

          # Поиск ZIP архивов
          zips = []
          for root, dirs, files in os.walk('.'):
              if any(x in root for x in ['.gradle', 'build', '.git', '.github']):
                  continue
              for f in files:
                  if f.endswith('.zip'):
                      zips.append(os.path.join(root, f))

          if zips:
              print('Найдены ZIP архивы:', zips)
              for z in zips:
                  print(f'Распаковка {z}...')
                  with zipfile.ZipFile(z, 'r') as zf:
                      zf.extractall('extracted')

              target_folder = None
              for root, dirs, files in os.walk('extracted'):
                  if 'build.gradle' in files or 'fabric.mod.json' in files or 'src' in dirs:
                      target_folder = root
                      break

              if target_folder:
                  print(f'Переносим файлы из {target_folder} в корень...')
                  for item in os.listdir(target_folder):
                      s = os.path.join(target_folder, item)
                      d = os.path.join('.', item)
                      if os.path.exists(d) and d != './extracted':
                          if os.path.isdir(d):
                              shutil.rmtree(d)
                          else:
                              os.remove(d)
                      shutil.move(s, d)

              if os.path.exists('extracted'):
                  shutil.rmtree('extracted')
          else:
              print('ZIP архивы не найдены!')

          # Если ZIP не было или распаковалось в подпапку
          if not os.path.exists('src') and not os.path.exists('build.gradle'):
              print('Файлы не найдены в корне. Ищем в подпапках...')
              for root, dirs, files in os.walk('.'):
                  if any(x in root for x in ['.gradle', 'build', '.git', '.github']):
                      continue
                  if 'build.gradle' in files or 'src' in dirs:
                      print(f'Перемещаем файлы из подпапки {root} в корень...')
                      for item in os.listdir(root):
                          s = os.path.join(root, item)
                          d = os.path.join('.', item)
                          if os.path.exists(d):
                              if os.path.isdir(d):
                                  shutil.rmtree(d)
                              else:
                                  os.remove(d)
                          shutil.move(s, d)
                      break

          print('=== 2. СТРУКТУРА ПОСЛЕ ПОДГОТОВКИ ===')
          print('Файлы в корне:', os.listdir('.'))
          if os.path.exists('src'):
              print('Папка src успешно найдена!')
          else:
              print('ОШИБКА: Папка src ВСЁ ЕЩЁ НЕ НАЙДЕНА! Проверьте, загружен ли код в репозиторий.')
          "

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Verify JAR File
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Ошибка: .jar файл не найден в build/libs!"
            exit 1
          fi
          
          SIZE=$(stat -c%s "$JAR_FILE")
          echo "Найден мод: $JAR_FILE"
          echo "Размер мода: $SIZE байт"
          
          if [ "$SIZE" -lt 10000 ]; then
            echo "Ошибка: Собрался пустой .jar файл ($SIZE байт)."
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Mod
          path: build/libs/*.jar
          
