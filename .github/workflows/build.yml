name: Build Mod from ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Распаковка и перенос файлов
        run: |
          unzip -o *.zip
          BG_FILE=$(find . -mindepth 2 -name "build.gradle" | head -n 1)
          if [ -n "$BG_FILE" ]; then
            DIR=$(dirname "$BG_FILE")
            echo "Переносим файлы из $DIR в корень..."
            cp -rn "$DIR"/* .
          fi

      - name: Замена маппингов на Intermediary v2
        run: |
          if [ -f "build.gradle" ]; then
            sed -i 's/mappings .*/mappings "net.fabricmc:intermediary:1.16.5:v2"/g' build.gradle
            echo "Маппинги успешно заменены!"
          fi

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Сборка .jar
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew build
          else
            gradle build
          fi

      - name: Сохранение мода
        uses: actions/upload-artifact@v4
        with:
          name: ReallyVisuals-Mod
          path: "**/build/libs/*.jar"
          
