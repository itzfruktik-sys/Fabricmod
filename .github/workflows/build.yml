name: Build Mod from ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Распаковка архива
        run: |
          unzip -o *.zip
          for dir in */; do
            if [ -f "${dir}build.gradle" ]; then
              cp -rn "$dir"* . || true
            fi
          done

      - name: Авто-исправление маппингов
        run: |
          python3 -c "
          import re
          with open('build.gradle', 'r') as f:
              content = f.read()
          new_content = re.sub(r'mappings\s+[\"'].*?[\"']', 'mappings \"net.fabricmc:intermediary:1.16.5:v2\"', content)
          with open('build.gradle', 'w') as f:
              f.write(new_content)
          print('--- Маппинги заменены на Intermediary v2 ---')
          " || true

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Сборка `.jar`
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew build
          else
            gradle build
          fi

      - name: Выгрузка готового мода
        uses: actions/upload-artifact@v4
        with:
          name: ReallyVisuals-Mod
          path: "**/build/libs/*.jar"
          
