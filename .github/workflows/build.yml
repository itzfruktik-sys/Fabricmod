name: Build Mod from ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковка архива
        run: |
          unzip -o ReallyVisuals.zip
          if [ -d "ReallyVisuals" ]; then
            cp -rn ReallyVisuals/* . || true
          fi

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Сборка `.jar`
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew build
          else
            gradle build
          fi

      - name: Выгрузка готового мода
        uses: actions/upload-artifact@v4
        with:
          name: ReallyVisuals-Mod
          path: "**/build/libs/*.jar"
          
