name: Build Mod from ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Распаковка архива и поиск файлов
        run: |
          unzip -o *.zip
          TARGET_DIR=$(dirname $(find . -mindepth 2 -name "build.gradle" | head -n 1))
          if [ -n "$TARGET_DIR" ] && [ "$TARGET_DIR" != "." ]; then
            echo "Перенос файлов из $TARGET_DIR в корень..."
            cp -r "$TARGET_DIR"/* .
          fi

      - name: Авто-исправление маппингов
        run: |
          python3 -c "
          import os, re
          if os.path.exists('build.gradle'):
              with open('build.gradle', 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              new_content = re.sub(r'mappings\s+[\"'].*?[\"']', 'mappings \"net.fabricmc:intermediary:1.16.5:v2\"', content)
              with open('build.gradle', 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print('--- Маппинги установлены на Intermediary v2 ---')
          "

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Установка Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Сборка `.jar`
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew build
          else
            gradle build
          fi

      - name: Выгрузка готового мода
        uses: actions/upload-artifact@v4
        with:
          name: ReallyVisuals-Mod
          path: "**/build/libs/*.jar"
          
